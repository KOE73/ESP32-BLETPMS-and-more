; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; https://docs.platformio.org/en/latest/projectconf/index.html
; https://docs.platformio.org/en/latest/projectconf/interpolation.html

; Общие настройки
[platformio]
;default_envs = ESP32-C6-LCD1_47-SD-debug ; Укажите среду по умолчанию
;default_envs = ESP32-C6-ST7789-SD-debug ; Укажите среду по умолчанию
;default_envs = ESP32-C3-debug ; Укажите среду по умолчанию
default_envs = lilygo-t-display-s3 ; Укажите среду по умолчанию

;src_dir = examples/${platformio.default_envs}

;[env:ESP32-C6-LCD1_47-SD-debug]
;platform = espressif32
;;@5.4.0
;board = esp32-c6-devkitm-1
;framework = espidf
;build_type = debug ; Debug version
;monitor_speed = 115200
;
;; change microcontroller
;board_build.mcu = esp32c6
;
;; change MCU frequency
;board_build.f_cpu = 160000000L
;extends = env:common

# https://aliexpress.ru/item/1005008096947111.html?spm=a2g2w.orderdetail.0.0.27484aa6QdmEJc&sku_id=12000043713378139
# https://www.waveshare.com/wiki/ESP32-C6-LCD-1.47
[env:ESP32-C6-ST7789-SD-debug]
platform = https://github.com/platformio/platform-espressif32.git
board = esp32-c6-devkitm-1
board_build.mcu = esp32c6
framework = espidf
build_type = debug ; Debug version
monitor_speed = 115200
upload_speed = 921600 # 460800  # Скорость передачи данных (в бодах)
; esp-bridge esp-builtin esp-prog espota esptool
;upload_protocol = esp-builtin
; [--after {hard_reset,soft_reset,no_reset,no_reset_stub}]
; [--before {default_reset,usb_reset,no_reset,no_reset_no_sync}]
;upload_flags = --after=soft_reset
;    "before default_reset"
;lib_deps =
;    espressif/led_strip
               
#build_flags = 
#    -D ARDUINO_USB_MODE=1
#    -D ARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = ESP32-C6-debug.csv
;board_build.sdkconfig = dkconfig.ESP32-C6-ST7789-SD-debug
extends = env:common


[env:ESP32-C3-debug-jtag]
platform = https://github.com/platformio/platform-espressif32.git
board = esp32-c3-devkitm-1
framework = espidf
build_type = debug ; Debug version
monitor_speed = 115200
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
upload_protocol = esp-builtin
debug_tool = esp-builtin
;extends = env:common


[env:ESP32-C3-debug]
platform = https://github.com/platformio/platform-espressif32.git
board = esp32-c3-devkitm-1
framework = espidf
build_type = debug ; Debug version
monitor_speed = 115200
upload_speed = 921600 # 460800
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = ESP32-C3-debug.csv
;extends = env:common

[env:lilygo-t-display-s3]
platform = https://github.com/platformio/platform-espressif32.git
board = lilygo-t-display-s3
framework = espidf
build_type = debug ; Debug version
debug_tool = esp-builtin
;build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 921600
monitor_after_reset = true
upload_speed = 921600 
board_build.partitions = lilygo-t-display-s3.csv
build_flags =
    ${common.build_flags}
    -D LV_COLOR_16_SWAP=1       ; + Important for correct display of LVGL colors
    ; -v

;extends = env:common


; CUSTOM options
; You need manually inject these options into a section
; using ${common.<name_of_option>} (see below)
[common]
build_flags = 
    -Ilib/yaidfws
    -Ilib/yabt
    -D USE_ESP32                ; Времено
    -D USE_WEBSERVER            ; Времено
    -D USE_WEBSERVER_LOCAL      ; Времено
    -D USE_ESP_IDF              ; Времено
    -D LV_CONF_PATH=${PROJECT_SRC_DIR}/modules/lcd/lv_conf.h
    ;-D LV_CONF_INCLUDE_SIMPLE   ; LVGL
    ;-D LV_CONF_PATH=${PROJECT_DIR}/src/modules/lcd/lv_conf.h
    ;-D CONFIG_FREERTOS_SMP ; intersing, but not compiled. See CMakeList

;[env:common]

; COMMON options
; Each "[env:***]" extends this "[env]" by default  
[env]
extra_scripts = pre:extra_script.py

; Make *.S asm files with allow preprocessor. Then CMakeLists.txt works, see at it
board_build.embed_txtfiles = 
    src/www/index.html
    src/www/css.css
board_build.embed_files = 
    src/www/.gz/ble.html.gz
    src/www/.gz/index.html.gz
    src/www/.gz/css.css.gz

; See https://docs.platformio.org/en/latest/core/userguide/pkg/cmd_install.html#local-folder
lib_deps =
    bblanchon/ArduinoJson
    lvgl/lvgl

lib_extra_dirs = 
    lib/yaidfws
    lib/yabt

lib_archive = false  ; Отключает создание .a-файлов

;monitor_filters = colorize   
;monitor_filters = 
;    colorize    ; 
;    ;direct      ; Do-nothing: forward all data unchanged. Useful if data already contains ANSI escape codes (colors)  
;    ;default   ; Remove typical terminal control codes from input
;    ;time      ; Add timestamp with milliseconds for each new line
;    esp32_exception_decoder     ; Custom filter for Espressif 32 which decodes crash exception

; For color terminal
monitor_raw = yes

