<html>
<meta charset="UTF-8">
<title>SSE Client</title>

<head>
    <link rel='stylesheet' href='css.css' type='text/css'>
</head>

<body>
    It's body! Hello, ESP32 Web Server!

    <div class="container">
        <div class="column">
            <div id="messages">
                <input type="text" id="input1" placeholder="Введите сообщение">
                <button onclick="sendMessage(1)">Отправить</button>
                <h2>Messages:</h2>
                <div>webTick: <span id="webTick_id"></span></div>
                <div>mainTick: <span id="mainTick_id"></span></div>
            </div>

        </div>
        <div class="column">
            <div id="messages">

            </div>
        </div>
        <div class="column">
            <div id="diagnostic-task-grid">

            </div>
        </div>

    </div>


    <script>
        const origin = window.location.origin;
        const host = window.location.host;

        // WS -----------------------------------------

        // Подключение к WebSocket-серверу
        const socket1 = new WebSocket('ws://' + host + '/ws'); // Укажите IP вашего WebSocket-сервера

        socket1.onopen = function () { outMessage('Соединение с сервером установлено', ''); };
        socket1.onmessage = function (event) { outMessage('Получено сообщение', event.data); outMessage2(event); };
        socket1.onerror = function (error) { outMessage('Ошибка WebSocket', error); };
        socket1.onclose = function (event) { outMessage('Соединение закрыто', ''); };

        function sendMessage(x) {
            switch (x) {
                case 1: sendMessage2('input1'); break;
                case 2: sendMessage2('input2'); break;
            }
        }

        function sendMessage2(inpitKey) {
            const message = document.getElementById(inpitKey).value;
            if (message && socket1.readyState === WebSocket.OPEN) {

                // Формируем JSON-объект
                const jsonData = {
                    type: 'message',
                    content: message,
                    timestamp: new Date().toISOString()
                };

                // Преобразуем объект в строку JSON
                const jsonString = JSON.stringify(jsonData);

                socket1.send(jsonString);
            } else {
                alert('WebSocket соединение не установлено или сообщение пустое');
            }
            document.getElementById(inpitKey).value = ''; // Очистка поля ввода
        }

        function outMessage(msg, data) { console.log(msg + ':', data); }

        function outMessage2(event) {
            const data = JSON.parse(event.data);
            switch (data.msgType) {
                case 'webTick':
                    div = document.getElementById('webTick_id');
                    div.innerText = data.id;
                    break;
                case 'mainTick':
                    div = document.getElementById('mainTick_id');
                    div.innerText = data.id;
                    break;
                case 'diagnostic':
                    document.getElementById('diagnostic-task-grid').innerHTML = diagnostic(data);
                    break;
            }
        }

        function diagnostic(diagnosticData) {

            // Сортировка задач по task_num
            diagnosticData.tasks.sort((a, b) => b.rp - a.rp);

            // Формирование HTML
            let html = '<div class="diagnostic-grid-container">';

            // Заголовки
            html += `
                <div class="grid-header">Name</div>
                <div class="grid-header">Task#</div>
                <div class="grid-header">S</div>
                <div class="grid-header">P</div>
                <div class="grid-header">Stack<br/>Free</div>
                <div class="grid-header">Runtime</div>
                <div class="grid-header">%</div>
            `;

            // Данные задач
            diagnosticData.tasks.forEach(task => {
                html += `
                    <div class="grid-item">${task.name}</div>
                    <div class="grid-item r">${task.tn}</div>
                    <div class="grid-item">${task.s}</div>
                    <div class="grid-item r">${task.p}</div>
                    <div class="grid-item r">${task.sf}</div>
                    <div class="grid-item r">${task.rt}</div>
                    <div class="grid-item r">${task.rp}%</div>
                `;
            });

            // Итоговые данные
            html += `
                <div class="grid-item" style="grid-column: span 7; text-align: left;">
                    Total Tasks: ${diagnosticData.total_tasks}, Free Heap: ${formatNumberWithThinSpaces(diagnosticData.free_heap)} bytes
                </div>
            `;

            html += '</div>';
            return html;
             

        }

        function formatNumberWithThinSpaces(number) {
            // \u00A0 \u2009
            return number.toLocaleString('en-US', { useGrouping: true }).replace(/,/g, '\u00A0');
        }
    </script>

</body>

</html>
